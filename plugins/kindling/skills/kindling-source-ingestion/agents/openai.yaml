interface:
  display_name: "Kindling Source Ingestion"
  short_description: "Review and safely ingest external knowledge"
  default_prompt: "Use $kindling-source-ingestion to review my latest Granola sources for safe Kindling ingestion."
dependencies:
  tools:
    - type: "mcp"
      value: "granola"
      description: "Read the user's authorized Granola meeting notes."
      transport: "streamable_http"
      url: "https://mcp.granola.ai/mcp"
    - type: "mcp"
      value: "kindling"
      description: "Search and ingest approved knowledge in the connected Kindling workspace."
      transport: "streamable_http"
      url: "https://api.kindling.team/mcp"
policy:
  allow_implicit_invocation: true
