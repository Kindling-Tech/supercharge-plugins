# Append to ~/.codex/config.toml (user scope) or <repo>/.codex/config.toml (project).
# Set SUPERCHARGE_MCP_TOKEN in your environment first (export SUPERCHARGE_MCP_TOKEN=mcp_live_...).

[mcp_servers.supercharge]
url = "https://api.supercharge.so/mcp"   # replace with your env's /mcp URL (see INSTALL.md)
bearer_token_env_var = "SUPERCHARGE_MCP_TOKEN"

# OPTIONAL auto-ingest hook (verify the exact [hooks] schema against
# https://developers.openai.com/codex/hooks for your Codex version before enabling):
# [[hooks.UserPromptSubmit]]
# command = ["python3", "/abs/path/to/plugins/supercharge-ingest/hooks/detect_ingest_intent.py"]
